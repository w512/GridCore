# GridCore example configuration for a 16 GB NVIDIA card.
# Copy to ~/.config/gridcore/config.yaml and adjust the model paths.
#
# The model set below is a good fit for 16 GB: a 12B
# generalist with vision as the interactive default, a small fast model for
# ambient/background tasks, and a pinned embedder. All three stay resident
# together (about 13 GB). Files are the official QAT quants from Hugging Face:
#   google/gemma-4-12B-it-qat-q4_0-gguf   gemma-4-12b-it-qat-q4_0.gguf + mmproj-gemma-4-12b-it-qat-q4_0.gguf
#   unsloth/gemma-4-E4B-it-qat-GGUF       gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf + mmproj-F16.gguf
#   nomic-ai/nomic-embed-text-v1.5-GGUF   nomic-embed-text-v1.5.f16.gguf

server:
  listen: 127.0.0.1:8080

gpu:
  # auto | nvidia:<index> | fake
  device: nvidia:0
  # Artificial VRAM cap in MB. Useful to leave room for other apps or to
  # create memory pressure for testing. null = use device total.
  vram_limit_mb: null
  # Safety margin. Estimates are GGUF-based and driver overhead is tracked
  # separately, so 256-512 MB is plenty.
  headroom_mb: 512
  poll_interval: 500ms

runtimes:
  llamacpp:
    # scripts/install-llamacpp.sh installs a prebuilt CUDA release here.
    binary: /opt/llama.cpp/current/llama-server
    port_range: [41000, 41999]
    load_timeout: 180s
    default_args: ["--flash-attn", "on"]

models:
  # Interactive default. Dense 12B, text + vision, ~8.5 GB, ~35 tok/s on a 4060 Ti.
  gemma4-12b:
    runtime: llamacpp
    path: ~/models/gemma-4-12b-it-qat-q4_0.gguf
    mmproj: ~/models/mmproj-gemma-4-12b-it-qat-q4_0.gguf
    capabilities: [chat, vision]
    # ctx is the total context pool shared by all slots (llama-server
    # --ctx-size); parallel is the number of slots (--parallel).
    ctx: 16384
    parallel: 2
    # Modern instruct models (Gemma 4, Qwen3, Ornith) think by default; with a
    # small max_tokens the whole answer ends up in reasoning_content and
    # content is empty. Turn thinking off here; clients that want it can
    # re-enable it per request.
    args: ["--reasoning-budget", "0", "--temp", "1.0", "--top-p", "0.95", "--top-k", "64"]
    aliases: [gpt-4o, default-chat]

  # Ambient / background tasks: screenshots, classification, quick answers.
  # Text + vision + audio, ~4.2 GB, ~80 tok/s.
  gemma4-e4b:
    runtime: llamacpp
    path: ~/models/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
    mmproj: ~/models/mmproj-gemma-4-E4B-F16.gguf
    capabilities: [chat, vision]
    ctx: 8192
    parallel: 2
    args: ["--reasoning-budget", "0", "--temp", "1.0", "--top-p", "0.95", "--top-k", "64"]
    aliases: [ambient]

  # Embeddings. Pinned: preloaded at start and never evicted.
  nomic-embed:
    runtime: llamacpp
    path: ~/models/nomic-embed-text-v1.5.f16.gguf
    capabilities: [embedding]
    ctx: 2048
    parallel: 4
    pinned: true

  # A larger text-only model to see eviction at work: it does not fit next
  # to gemma4-12b, so an interactive request for it evicts the idle one.
  # qwen3-14b:
  #   runtime: llamacpp
  #   path: ~/models/Qwen3-14B-Q4_K_M.gguf        # Qwen/Qwen3-14B-GGUF
  #   capabilities: [chat]
  #   ctx: 8192
  #   parallel: 2
  #   args: ["--reasoning-budget", "0"]

  # A 27B on a 16 GB card. At IQ4_XS (13.3 GB) it fits on the GPU entirely:
  # 13.7 GB VRAM, ~18 tok/s, wikitext PPL +0.9% vs Q4_K_M. Only the pinned
  # embedder fits next to it, so every other request evicts it and back.
  #   unsloth/Qwen3.8-27B-GGUF   Qwen3.8-27B-UD-IQ4_XS.gguf (+ mmproj-F16.gguf for vision, +1.2 GB VRAM)
  # qwen38-27b-iq4xs:
  #   runtime: llamacpp
  #   path: ~/models/Qwen3.8-27B-UD-IQ4_XS.gguf
  #   capabilities: [chat]
  #   ctx: 8192
  #   parallel: 1
  #   args: ["--reasoning-format", "deepseek", "--reasoning-budget", "0", "--temp", "1.0", "--top-p", "0.95", "--top-k", "20"]
  #   aliases: [qwen38]

  # The same model at Q4_K_M (16.5 GB) is bigger than the card: 64 of 65
  # layers go to the GPU, the last one plus the output layer stay on the CPU
  # (--n-gpu-layers in args overrides the default 999): 15.3 GB VRAM,
  # ~14 tok/s. The estimate does not know about the CPU part, so run
  # `gridcore bench qwen38-27b` once; the measured footprint replaces the
  # estimate, which alone would exceed the budget. IQ3_XXS (10.2 GB) fits
  # next to a 4 GB model but leaks stray </think> tokens; not recommended.
  # qwen38-27b:
  #   runtime: llamacpp
  #   path: ~/models/Qwen3.8-27B-UD-Q4_K_M.gguf
  #   capabilities: [chat]
  #   ctx: 8192
  #   parallel: 1
  #   args: ["--n-gpu-layers", "64", "--reasoning-format", "deepseek", "--reasoning-budget", "0", "--temp", "1.0", "--top-p", "0.95", "--top-k", "20"]

policy:
  default_class: interactive
  classes:
    # A model that served an interactive request within hot_ttl is "hot":
    # background work may not evict it.
    interactive: { priority: 100, hot_ttl: 5m }
    background:  { priority: 30 }
    batch:       { priority: 10 }
  # Quiet period after the last interactive step before background may start.
  interactive_idle_before_background: 2s
  # Under continuous interactive traffic, let one background/batch step run
  # alongside it once the background queue has made no progress for this
  # long. "0s" = strict exclusivity (background may starve). Durations need
  # a unit: 3s, 500ms.
  background_max_starvation: 3s
  embedding_chunk_size: 32
