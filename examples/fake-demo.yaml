# Runs the whole scheduler on any machine, no GPU required.
#
#   gridcore serve --config examples/fake-demo.yaml
#   gridcore status --watch
#
# The fake runtime answers every request with a canned response after
# fake_request_delay; the fake GPU has 16 GB. Model sizes mimic a real
# 16 GB card: a 14B chat model, a 7B vision model and a small embedder
# cannot all be resident at once, so eviction kicks in naturally.

server:
  listen: 127.0.0.1:8080

gpu:
  device: fake
  fake_total_mb: 16384
  headroom_mb: 512
  poll_interval: 250ms

runtimes:
  sim:
    type: fake
    port_range: [41000, 41999]
    fake_request_delay: 800ms

models:
  qwen3-14b:
    runtime: sim
    capabilities: [chat]
    parallel: 2
    aliases: [gpt-4o, default-chat]
    fake_vram_mb: 9600
    fake_load_time: 6s

  qwen2.5-vl-7b:
    runtime: sim
    capabilities: [chat, vision]
    parallel: 1
    fake_vram_mb: 6200
    fake_load_time: 4s

  qwen3-4b:
    runtime: sim
    capabilities: [chat]
    parallel: 2
    fake_vram_mb: 3000
    fake_load_time: 2s

  nomic-embed:
    runtime: sim
    capabilities: [embedding]
    parallel: 4
    pinned: true
    fake_vram_mb: 600
    fake_load_time: 1s

# "model": "qwen3" gets the 14B when it can and the 4B when the 14B would
# have to evict something (background) or cannot fit at all (interactive).
families:
  qwen3:
    preferred: qwen3-14b
    compact: qwen3-4b

policy:
  default_class: interactive
  classes:
    interactive: { hot_ttl: 2m }
  interactive_idle_before_background: 2s
  # Under continuous interactive traffic, let one background/batch step run
  # alongside it once the background queue has made no progress for this
  # long. "0s" = strict exclusivity (background may starve). Durations need
  # a unit: 3s, 500ms.
  background_max_starvation: 3s
  embedding_chunk_size: 32
